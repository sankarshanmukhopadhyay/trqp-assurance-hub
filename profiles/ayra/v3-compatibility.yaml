  - ayra_requirement: AYRA-RATE-001
    classification: evidence_gap
    candidate_section: "15 Error semantics"
    migration_effect: binding_update_candidate
    evidence_gap: Candidate v3 states general error invariants but does not define a rate-limit-specific 429 contract or Retry-After behaviour.
    reassessment_trigger: Reassess when a candidate-v3 HTTP binding defines rate-limiting semantics.
  - ayra_requirement: AYRA-EXT-001
    classification: extended_by_profile
    candidate_section: "7 Request processing / 11 Transport and binding boundary"
    migration_effect: profile_update_candidate
    evidence_gap: Candidate v3 does not standardize Ayra extension endpoints; they remain profile-owned unless upstream later defines equivalent capabilities.
    reassessment_trigger: Reassess if upstream standardizes extension/discovery endpoint semantics or Ayra revises its extension surface.
  - ayra_requirement: AYRA-EXT-002
    classification: extended_by_profile
    candidate_section: "15 Error semantics"
    migration_effect: binding_update_candidate
    evidence_gap: Candidate v3 does not define Ayra's 501 rule for unsupported optional extension endpoints.
    reassessment_trigger: Reassess when a candidate-v3 binding defines unsupported-capability behaviour.
  - ayra_requirement: AYRA-TLS-001
    classification: evidence_gap
    candidate_section: "11 Transport and binding boundary / 16 Security considerations"
    migration_effect: binding_update_candidate
    evidence_gap: Candidate v3 is intentionally transport-independent and does not make TLS 1.2+ a core semantic invariant; TLS requirements belong to an eventual HTTP binding or security profile.
    reassessment_trigger: Reassess when an authoritative candidate-v3 HTTP/security binding is defined.
  - ayra_requirement: AYRA-SIGN-001
    classification: evidence_gap
    candidate_section: "9 Response processing / 16 Security considerations"
    migration_effect: authority_decision_required
    evidence_gap: Candidate v3 requires provenance/auditability but does not define the Ayra response-signing mechanism; Ayra itself marks the mechanism as unsettled.
    reassessment_trigger: Reassess when Ayra or upstream TRQP defines a stable signing mechanism and normative strength.
  - ayra_requirement: AYRA-AUTH-001
    classification: narrowed_by_profile
    candidate_section: "12 Endpoint and capability discovery / 13 Governance and security profiles"
    migration_effect: profile_update_candidate
    evidence_gap: Candidate v3 keeps discovery mechanism and profile authority/lifecycle unresolved; Ayra's authority_id discovery rule is a concrete profile narrowing, not a candidate-core rule.
    reassessment_trigger: Reassess when NTRQP-007/NTRQP-008 receive authoritative upstream disposition or Ayra revises governance discovery.
  - ayra_requirement: AYRA-DID-001
    classification: conflict_candidate
    candidate_section: "3.1 Proposition / 12 Endpoint and capability discovery"
    migration_effect: profile_update_candidate
    evidence_gap: Candidate v3 separates semantic registry/authority identity from endpoint and transport identity and does not require DIDs as the universal core identifier form.
    reassessment_trigger: Reassess when upstream defines normative registry/authority identifier representation.
  - ayra_requirement: AYRA-DID-002
    classification: narrowed_by_profile
    candidate_section: "12 Endpoint and capability discovery"
    migration_effect: profile_update_candidate
    evidence_gap: Candidate v3 explicitly leaves the discovery mechanism unresolved, including whether DID resolution is used; Ayra's DID-document service discovery is therefore profile-specific.
    reassessment_trigger: Reassess when NTRQP-007 discovery mechanism is normatively resolved or Ayra changes its DID service-discovery rule.
