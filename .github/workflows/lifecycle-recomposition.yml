name: Lifecycle Recomposition

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate lifecycle recomposition boundaries
        run: python scripts/validate_lifecycle_recomposition.py
