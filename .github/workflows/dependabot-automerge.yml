name: Dependabot review disposition for security-sensitive dependencies

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-disposition:
    name: Evaluate Dependabot update
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read dependency update metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
      - name: Require human review of release-sensitive dependency changes
        run: |
          echo "Dependabot update is advisory only. No automatic merge."
          echo "Changes to GitHub Actions, release dependencies and signing or"
          echo "publication controls require repository-authorized review."
