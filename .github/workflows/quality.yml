name: quality
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  markdown_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Markdown lint
        uses: avto-dev/markdown-lint@04d43ee9191307b50935a753da3b775ab695eceb # v1
        with:
          config: '.markdownlint.yml'
          args: '**/*.md'
  link_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --verbose --no-progress
            --max-retries 3 --retry-wait-time 2 --timeout 20
            --max-redirects 10
            --accept 200,201,202,204,206,301,302,303,307,308,401,403,429
            --exclude '^https://untp\.unece\.org/'
            --exclude '^https://un\.opensource\.unicc\.org/'
            '**/*.md'
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema PyYAML pytest
      - name: Validate examples against schemas
        run: python tools/validate_examples.py
      - name: Validate profile requirement catalogue
        run: python tools/validate_profile_requirements.py
      - name: Run profile assurance tests
        run: python -m pytest -q tests/test_profile_assurance_model.py tests/test_ayra_profile_runner.py tests/test_ayra_authority_evidence.py tests/test_ayra_adversarial.py tests/test_ayra_assurance_bundle.py
      - name: Exercise Ayra conformant fixture
        run: python -m tools.run_ayra_profile tests/fixtures/ayra/conformant.json --out /tmp/ayra-assurance.json
      - name: Build reproducible Ayra evidence bundle
        run: |
          rm -rf /tmp/ayra-bundle
          python -m tools.build_ayra_assurance_bundle \
            tests/fixtures/ayra/conformant.json \
            tests/fixtures/ayra/authority-success.json \
            --run-id ayra-ci-001 \
            --observed-at 2026-09-10T15:30:00Z \
            --out /tmp/ayra-bundle
          test -s /tmp/ayra-bundle/assurance.json
          test -s /tmp/ayra-bundle/assurance.md
          test -s /tmp/ayra-bundle/requirement-results.json
          test -s /tmp/ayra-bundle/authority-evidence.json
          test -s /tmp/ayra-bundle/endpoint-evidence.json
          test -s /tmp/ayra-bundle/negative-tests.json
          test -s /tmp/ayra-bundle/provenance.json
      - name: Regenerate operational stack demo bundle
        run: |
          rm -rf /tmp/operational-stack
          python tools/run_operational_stack.py \
            --cts-report examples/operational-stack/demo-input/cts-report.json \
            --tspp-report examples/operational-stack/demo-input/tspp-report.json \
            --target https://directory.example.org \
            --build-id opstack-demo-001 \
            --target-id demo-directory \
            --run-id opstack-demo-001 \
            --assurance-profile profiles/al2-verified.yaml \
            --out /tmp/operational-stack
      - name: Validate regenerated bundle
        run: python tools/validate_operational_stack.py --bundle-dir /tmp/operational-stack
      - name: Validate checked-in bundle
        run: python tools/validate_operational_stack.py --bundle-dir artifacts/operational-stack
      - name: Doc tests (JSON/YAML parse hygiene)
        run: python scripts/doc_tests.py
      - name: generate-manifest dry-run (manifest generation path stays green)
        run: |
          python tools/generate-manifest.py \
            --build-id "dry-run-check" \
            --target "https://registry.example.org" \
            --cs-version "1.8.0" \
            --cs-profile-id "baseline" \
            --cs-run-id "dry-run-run" \
            --tspp-version "0.15.0" \
            --tspp-assurance-level "AL1" \
            --tspp-run-id "dry-run-run" \
            --overall-status "pass" \
            --artifact "log:README.md:trqp_assurance_hub:text/markdown:readme-v1:dry-run placeholder" \
            --base-dir . \
            --schema schemas/combined-assurance-manifest.schema.json \
            --out /tmp/dry-run-manifest.json \
            --dry-run
