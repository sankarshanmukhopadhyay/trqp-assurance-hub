name: Weekly merged-branch housekeeping
on:
  schedule:
    - cron: '17 23 * * 5'
      timezone: Asia/Kolkata
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: weekly-branch-housekeeping
  cancel-in-progress: false
jobs:
  housekeeping:
    uses: qbf-consulting/.github/.github/workflows/branch-housekeeping-reusable.yml@ca0eab0f38b07f2dfdfc3429d81910233d07a8fc
    with:
      dry_run: true
      preserve_patterns: 'gh-pages,release/**,research/**,draft/**,convergence/**'
