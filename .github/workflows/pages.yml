name: Deploy documentation to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.md"
      - "_config.yml"
      - "Gemfile"
      - "_includes/**"
      - "assets/**"
      - "scripts/validate_docs_site.py"
      - "scripts/validate_built_site.py"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.md"
      - "_config.yml"
      - "Gemfile"
      - "_includes/**"
      - "assets/**"
      - "scripts/validate_docs_site.py"
      - "scripts/validate_built_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Validate documentation inputs
        run: python3 scripts/validate_docs_site.py

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Validate rendered site links
        run: python3 scripts/validate_built_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
