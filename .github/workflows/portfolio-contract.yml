name: Portfolio Integration Contract

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Validate portfolio integration contract
        run: python tools/validate_portfolio_contract.py --output artifacts/validation/portfolio-integration-result.json
      - name: Upload portfolio integration evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portfolio-integration-evidence
          path: artifacts/validation/portfolio-integration-result.json
          if-no-files-found: error
