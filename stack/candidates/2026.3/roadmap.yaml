proposition:
  id: profile-aware-compositional-assurance
  statement: >-
    A profile-aware TRQP assurance conclusion must preserve the independent authority,
    provenance, lifecycle state, scope and bounded result of CTS, TSPP, ecosystem-profile,
    semantic/schema and external-governance evidence sources. No local-positive observation
    may override producer-owned failure, uncertainty or non-current evidence.
